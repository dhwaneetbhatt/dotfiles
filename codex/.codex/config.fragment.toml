# Durable, hand-authored Codex settings tracked in dotfiles.
#
# NOTE: ~/.codex/config.toml is NOT symlinked, because Codex continuously
# rewrites it at runtime (TUI nux counters, [hooks.state] trusted hashes,
# plugin/marketplace state) and does so with machine-specific absolute paths.
# Symlinking the whole file would churn the repo and could break the symlink
# if Codex writes via atomic rename. Instead, `bin/.local/bin/codex-config-sync`
# idempotently merges the settings below into ~/.codex/config.toml, and
# bootstrap runs it. Edit durable Codex settings HERE, then rerun bootstrap
# (or the sync script) to apply them.
