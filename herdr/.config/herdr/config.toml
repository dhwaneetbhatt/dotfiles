onboarding = false

[keys]
prefix = "ctrl+a"
previous_tab = ["prefix+p", "shift+left"]
next_tab = ["prefix+n", "shift+right"]
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"

# Worktrees are managed by the herdr-worktrunk plugin (worktrunk's `wt`), not
# herdr's built-in worktree commands, because worktrunk runs lifecycle hooks on
# create (copy gitignored files, project init) that the built-ins lack. The
# plugin_action binds below override the built-ins. close_workspace stays here,
# moved off its default prefix+shift+d so the worktree remove key can use shift+d.
#
# Note: shift+<letter> chords require pressing shift together with the letter
# (herdr sees them as separate key events otherwise).
close_workspace = "prefix+shift+q"

# Workspace navigation (shift+arrows = workspaces; plain arrows/shift above = tabs).
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"
last_pane = "prefix+semicolon"

# Agent navigation. goto picker stays on the default prefix+g; these add cycling
# and direct jump. a/z = prev/next ends of the list.
previous_agent = "prefix+shift+a"
next_agent = "prefix+shift+z"
focus_agent = "prefix+alt+1..9"

# --- Worktrunk worktree management (herdr-worktrunk plugin) ---
# worktrunk.open: fzf picker to switch to an existing worktree OR type a new name
# to create it from the default branch (runs worktrunk's hooks). Overrides herdr's
# built-in new_worktree on prefix+shift+g.
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "worktree: switch / create (default base)"

# Create from the CURRENT branch instead of the default base.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "worktrunk.open-current"
description = "worktree: switch / create (current base)"

# Remove a worktree (worktrunk prompts + gates unmerged/untracked itself).
[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "worktree: remove"

# Merge a worktree into the target branch, then remove it.
[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "worktree: merge into target"

# lazygit in a temporary pane (mirrors the tmux prefix+alt+g bind; shifted-l here
# since prefix+l alone is focus-pane-right).
[[keys.command]]
key = "prefix+shift+l"
type = "pane"
command = "lazygit"
description = "run lazygit"


[ui]
prompt_new_tab_name = false

[worktrees]
directory = "~/workspace"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[theme]
name = "catppuccin-latte"
auto_switch = false
