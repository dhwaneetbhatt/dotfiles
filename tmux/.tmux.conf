# List of plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum — automatic save every 15 minutes + auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g default-shell /bin/zsh

# Without these, tmux falls back to its own built-in default
# (screen-256color, 256 colors only) even though Ghostty (xterm-ghostty)
# supports full 24-bit truecolor — this is why things like lazygit's diff
# colors can look wrong/muted/missing inside tmux specifically.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set-option -g prefix C-a     # Set Ctrl+a as the prefix
unbind C-b                   # Unbind default prefix Ctrl+b
bind C-a send-prefix         # Send Ctrl+a to applications by pressing it twice
set -g base-index 1          # start indexing windows at 1 instead of 0
set -g escape-time 0         # zero-out escape time delay
set -g extended-keys on      # pass through shift/ctrl/alt key sequences
set -g history-limit 1000000 # increase history size (from 2,000)
set -g renumber-windows on   # renumber all windows when any window is closed
bind-key x kill-pane         # skip "kill-pane 1? (y/n)" prompt
bind C-l send-keys 'C-l'     # This allows you to use Prefix + Ctrl-l to clear the screen

# Status bar
set-option -g status-position top     # Set position of status bar to the top

# macOS only
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# New windows and panes inherit current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Reorder windows with Prefix + < or >
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Pick a worktree (workmux) and switch to (or create) its window
bind-key a display-popup -E -d '#{pane_current_path}' -w 90% -h 90% ~/.local/bin/workmux-picker

# Toggle the workmux agent-status sidebar
bind-key A run-shell '/opt/homebrew/bin/workmux sidebar'

# Workmux dashboard — all agents, live preview, jump/peek without switching
bind-key W display-popup -E -d '#{pane_current_path}' -w 95% -h 95% 'PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH" workmux dashboard'

# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
